<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>lumirel x WB</title>
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons (for UI icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        // Настраиваем цвета Tailwind на переменные темы Telegram
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tg: {
                            bg: 'var(--tg-theme-bg-color, #ffffff)',
                            text: 'var(--tg-theme-text-color, #000000)',
                            hint: 'var(--tg-theme-hint-color, #999999)',
                            link: 'var(--tg-theme-link-color, #cb11ab)', /* Розовый цвет WB */
                            button: 'var(--tg-theme-button-color, #cb11ab)',
                            buttonText: 'var(--tg-theme-button-text-color, #ffffff)',
                            secondaryBg: 'var(--tg-theme-secondary-bg-color, #f4f4f4)',
                        },
                        wb: {
                            main: '#cb11ab',
                            purple: '#9d18b0',
                            card: 'var(--tg-theme-bg-color, #ffffff)'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f4);
            color: var(--tg-theme-text-color, #000000);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        /* Скрываем скроллбары */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Анимация перелива для золотого текста */
        @keyframes goldShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .text-gold-shine {
            background: linear-gradient(to right, #b8860b 0%, #ffd700 20%, #fff8dc 40%, #ffd700 60%, #b8860b 80%, #ffd700 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: goldShine 4s linear infinite;
        }

        /* Анимации для модальных окон */
        .modal-enter {
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-enter-active {
            transform: translateY(0);
        }
        .modal-exit {
            transform: translateY(0);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-exit-active {
            transform: translateY(100%);
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
        
        input[type="checkbox"] {
            accent-color: var(--tg-theme-button-color, #cb11ab);
        }
    </style>
</head>
<body class="antialiased font-sans">

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="main-view" class="pb-20">
        <!-- Шапка -->
        <header class="bg-tg-bg/90 backdrop-blur-md border-b border-tg-secondaryBg pb-2">
            <!-- Название и кнопка Info -->
            <div class="px-4 py-3 flex justify-between items-center">
                <h1 class="text-xl font-bold flex items-center space-x-1.5">
                    <span class="text-gold-shine drop-shadow-sm">lumirel</span>
                    <span class="text-white" style="text-shadow: 0px 1px 3px rgba(0,0,0,0.5);">x</span>
                    <span class="text-wb-main drop-shadow-sm">WB</span>
                </h1>
                <button onclick="openInfoModal()" class="text-tg-text active:scale-90 transition-transform">
                    <i class="ph ph-info text-[26px]"></i>
                </button>
            </div>

            <!-- Поиск -->
            <div class="px-4 mb-2">
                <div class="relative">
                    <i class="ph ph-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-tg-hint text-lg"></i>
                    <input type="text" id="searchInput" placeholder="Я ищу..." 
                           class="w-full bg-tg-secondaryBg text-tg-text placeholder-tg-hint rounded-xl py-2.5 pl-10 pr-4 focus:outline-none focus:ring-1 focus:ring-wb-main text-[15px]">
                </div>
            </div>

            <!-- Фильтры: Категории -->
            <div class="px-4 mb-2 overflow-x-auto no-scrollbar">
                <div id="subcategoriesList" class="flex space-x-2 w-max pb-1">
                    <!-- Заполняется JS -->
                </div>
            </div>

            <!-- Фильтры: Бренды -->
            <div class="px-4 flex items-center justify-between mt-1">
                <span class="text-sm text-tg-hint font-medium" id="productsCount">Найдено: 0 товаров</span>
                <button onclick="openBrandsModal()" class="flex items-center space-x-1 text-sm bg-tg-secondaryBg px-3 py-1.5 rounded-lg text-tg-text active:scale-95 transition-transform">
                    <i class="ph ph-faders"></i>
                    <span>Бренды</span>
                    <span id="brandsBadge" class="hidden bg-wb-main text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center ml-1">0</span>
                </button>
            </div>
        </header>

        <!-- Сетка товаров -->
        <div id="productsGrid" class="grid grid-cols-2 gap-2 p-2">
            <!-- Заполняется JS -->
        </div>
        
        <!-- Загрузка -->
        <div id="loading" class="flex flex-col items-center justify-center py-10 text-tg-hint">
            <i class="ph ph-spinner-gap animate-spin text-3xl mb-2 text-wb-main"></i>
            <span class="text-sm">Загрузка товаров...</span>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: Бренды -->
    <div id="brands-modal-overlay" class="fixed inset-0 bg-black/50 z-40 hidden opacity-0 transition-opacity duration-300" onclick="closeBrandsModal()"></div>
    <div id="brands-modal" class="fixed bottom-0 left-0 right-0 bg-tg-bg z-50 rounded-t-2xl shadow-xl modal-enter pb-8 max-h-[80vh] flex flex-col hidden">
        <div class="px-4 py-3 border-b border-tg-secondaryBg flex justify-between items-center">
            <h2 class="text-lg font-bold text-tg-text">Фильтр по брендам</h2>
            <button onclick="closeBrandsModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-tg-secondaryBg text-tg-text">
                <i class="ph ph-x text-lg"></i>
            </button>
        </div>
        <div class="p-4 overflow-y-auto flex-1">
            <div id="brandsCheckboxes" class="space-y-3">
                <!-- Заполняется JS -->
            </div>
        </div>
        <div class="px-4 pt-2">
            <button onclick="applyBrandsFilter()" class="w-full bg-wb-main text-white py-3.5 rounded-xl font-medium text-[16px] active:bg-wb-purple transition-colors">
                Применить
            </button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: Информация / Соцсети -->
    <div id="info-modal-overlay" class="fixed inset-0 bg-black/50 z-40 hidden opacity-0 transition-opacity duration-300" onclick="closeInfoModal()"></div>
    <div id="info-modal" class="fixed bottom-0 left-0 right-0 bg-tg-bg z-50 rounded-t-2xl shadow-xl modal-enter pb-8 flex flex-col hidden">
        <div class="px-4 py-3 border-b border-tg-secondaryBg flex justify-between items-center">
            <h2 class="text-lg font-bold text-tg-text">Наши соцсети</h2>
            <button onclick="closeInfoModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-tg-secondaryBg text-tg-text">
                <i class="ph ph-x text-lg"></i>
            </button>
        </div>
        <div class="p-4 flex flex-col space-y-3">
            <!-- Instagram -->
            <a href="#" class="flex items-center space-x-3 p-3.5 rounded-xl bg-gradient-to-r from-[#833ab4] via-[#fd1d1d] to-[#fcb045] text-white active:scale-[0.98] transition-transform">
                <i class="ph ph-instagram-logo text-[28px]"></i>
                <span class="font-semibold text-[16px]">Instagram</span>
            </a>
            <!-- TikTok -->
            <a href="#" class="flex items-center space-x-3 p-3.5 rounded-xl bg-black text-white active:scale-[0.98] transition-transform">
                <i class="ph ph-tiktok-logo text-[28px]"></i>
                <span class="font-semibold text-[16px]">TikTok</span>
            </a>
            <!-- Threads -->
            <a href="#" class="flex items-center space-x-3 p-3.5 rounded-xl bg-[#101010] text-white active:scale-[0.98] transition-transform">
                <i class="ph ph-threads-logo text-[28px]"></i>
                <span class="font-semibold text-[16px]">Threads</span>
            </a>
            <!-- Max -->
            <a href="#" class="flex items-center space-x-3 p-3.5 rounded-xl bg-gradient-to-r from-blue-700 to-indigo-900 text-white active:scale-[0.98] transition-transform">
                <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
                <span class="font-semibold text-[16px]">Max</span>
            </a>
        </div>
    </div>

    <!-- ЭКРАН ТОВАРА (На весь экран) -->
    <div id="product-view" class="fixed inset-0 bg-tg-bg z-30 hidden overflow-y-auto pb-24">
        <!-- Контент товара заполняется JS -->
        <div id="product-content"></div>

        <!-- Нижняя липкая кнопка -->
        <div class="fixed bottom-0 left-0 right-0 p-4 bg-tg-bg border-t border-tg-secondaryBg z-40">
            <button id="openWbBtn" class="w-full bg-wb-main text-white py-3.5 rounded-xl font-bold text-[16px] shadow-lg shadow-wb-main/30 flex items-center justify-center space-x-2 active:scale-[0.98] transition-transform">
                <span>Открыть на ВБ</span>
                <i class="ph ph-arrow-square-out text-xl"></i>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        
        let allProducts = [];
        let filteredProducts = [];
        let currentProduct = null;
        
        let searchQuery = '';
        let selectedSubcategory = 'Все';
        let selectedBrands = new Set();
        let availableBrands = new Set();
        let availableSubcategories = new Set(['Все']);

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchAndLoadData();
            setupEventListeners();
        });

        async function fetchAndLoadData() {
            try {
                const response = await fetch('/api/products');
                if (response.ok) {
                    const data = await response.json();
                    
                    // Бэкенд уже отфильтровал товары по ярлыкам WB (БеликаМ, интерфармакс)
                    // Поэтому просто принимаем готовый массив
                    allProducts = data.products;

                } else {
                    throw new Error("Ошибка загрузки данных с сервера");
                }
            } catch (error) {
                console.error("Ошибка сети:", error);
                document.getElementById('loading').innerHTML = '<span class="text-red-500 text-sm">Ошибка загрузки товаров. Проверьте сервер.</span>';
                return;
            }

            // Подсчет товаров по подкатегориям для сортировки
            const subcategoryCounts = {};

            allProducts.forEach(p => {
                availableBrands.add(p.brand);
                subcategoryCounts[p.subcategory] = (subcategoryCounts[p.subcategory] || 0) + 1;
            });

            // СОРТИРОВКА КАТЕГОРИЙ: Сначала те, где больше товаров
            const sortedSubcategories = Object.keys(subcategoryCounts).sort((a, b) => subcategoryCounts[b] - subcategoryCounts[a]);
            availableSubcategories = new Set(['Все', ...sortedSubcategories]);

            document.getElementById('loading').style.display = 'none';
            
            renderSubcategories();
            renderBrandsFilter();
            applyFilters();
        }

        function renderSubcategories() {
            const container = document.getElementById('subcategoriesList');
            container.innerHTML = '';
            
            Array.from(availableSubcategories).forEach(sub => {
                const isSelected = sub === selectedSubcategory;
                const btn = document.createElement('button');
                btn.className = `px-4 py-1.5 rounded-full text-[14px] font-medium whitespace-nowrap transition-colors ${isSelected ? 'bg-wb-main text-white' : 'bg-tg-secondaryBg text-tg-text'}`;
                btn.textContent = sub;
                btn.onclick = () => {
                    selectedSubcategory = sub;
                    renderSubcategories(); 
                    applyFilters();
                };
                container.appendChild(btn);
            });
        }

        function renderBrandsFilter() {
            const container = document.getElementById('brandsCheckboxes');
            container.innerHTML = '';
            
            Array.from(availableBrands).forEach(brand => {
                const label = document.createElement('label');
                label.className = "flex items-center space-x-3 p-2 rounded-lg active:bg-tg-secondaryBg transition-colors";
                
                const checkbox = document.createElement('input');
                checkbox.type = "checkbox";
                checkbox.value = brand;
                checkbox.className = "w-5 h-5 rounded border-tg-hint text-wb-main focus:ring-wb-main";
                if(selectedBrands.has(brand)) checkbox.checked = true;
                
                checkbox.onchange = (e) => {
                    if(e.target.checked) selectedBrands.add(brand);
                    else selectedBrands.delete(brand);
                };

                const span = document.createElement('span');
                span.className = "text-[15px] text-tg-text";
                span.textContent = brand;

                label.appendChild(checkbox);
                label.appendChild(span);
                container.appendChild(label);
            });
        }

        function applyFilters() {
            filteredProducts = allProducts.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.brand.toLowerCase().includes(searchQuery.toLowerCase());
                const matchSub = selectedSubcategory === 'Все' || p.subcategory === selectedSubcategory;
                const matchBrand = selectedBrands.size === 0 || selectedBrands.has(p.brand);
                return matchSearch && matchSub && matchBrand;
            });

            // РАНДОМ: Если выбрана категория "Все", перемешиваем карточки случайным образом
            if (selectedSubcategory === 'Все') {
                for (let i = filteredProducts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [filteredProducts[i], filteredProducts[j]] = [filteredProducts[j], filteredProducts[i]];
                }
            }

            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            document.getElementById('productsCount').textContent = `Найдено: ${filteredProducts.length} товаров`;
            
            if(filteredProducts.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center py-10 text-tg-hint">Ничего не найдено</div>`;
                return;
            }

            filteredProducts.forEach(product => {
                const card = document.createElement('div');
                card.className = "bg-wb-card rounded-xl overflow-hidden shadow-sm border border-tg-secondaryBg flex flex-col active:scale-[0.98] transition-transform";
                card.onclick = () => openProductDetails(product);

                // Убраны белые рамки, картинка аккуратно заполняет верхнюю часть карточки
                card.innerHTML = `
                    <div class="relative w-full aspect-[3/4] bg-tg-secondaryBg flex items-center justify-center overflow-hidden">
                        <img src="${product.images[0]}" alt="${product.name}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-2 flex flex-col flex-1">
                        <div class="text-[13px] text-tg-hint mb-0.5 font-medium">${product.brand}</div>
                        <div class="text-[12px] text-tg-text leading-tight line-clamp-2">${product.name}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openProductDetails(product) {
            currentProduct = product;
            const view = document.getElementById('product-view');
            const content = document.getElementById('product-content');

            // Увеличена высота до 75vh, убраны белые рамки, используется object-contain для отображения фото без обрезки
            const imagesHtml = product.images.map(img => `
                <div class="flex-none w-full h-[75vh] snap-center flex items-center justify-center">
                    <img src="${img}" class="w-full h-full object-contain" alt="Product Image">
                </div>
            `).join('');

            content.innerHTML = `
                <div class="w-full flex overflow-x-auto snap-x snap-mandatory no-scrollbar relative bg-tg-secondaryBg">
                    ${imagesHtml}
                </div>
                
                <div class="p-4 bg-wb-card rounded-t-2xl -mt-6 relative z-10 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
                    <div class="text-lg font-bold text-tg-hint mb-1">${product.brand}</div>
                    <h1 class="text-xl text-tg-text leading-tight mb-4">${product.name}</h1>
                    <h3 class="font-bold text-lg text-tg-text mb-2">Описание</h3>
                    <p class="text-[15px] text-tg-text leading-relaxed opacity-90">${product.description}</p>
                    <div class="h-8"></div> 
                </div>
            `;

            view.classList.remove('hidden');
            window.scrollTo(0, 0);

            tg.BackButton.show();
            tg.BackButton.onClick(closeProductDetails);
        }

        function closeProductDetails() {
            document.getElementById('product-view').classList.add('hidden');
            currentProduct = null;
            tg.BackButton.hide();
            tg.BackButton.offClick(closeProductDetails);
        }

        // Логика Модалки Брендов
        function openBrandsModal() {
            const modal = document.getElementById('brands-modal');
            const overlay = document.getElementById('brands-modal-overlay');
            overlay.classList.remove('hidden');
            modal.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                modal.classList.remove('modal-enter');
            }, 10);
            document.body.style.overflow = 'hidden';
        }

        function closeBrandsModal() {
            const modal = document.getElementById('brands-modal');
            const overlay = document.getElementById('brands-modal-overlay');
            overlay.classList.add('opacity-0');
            modal.classList.add('modal-exit-active');
            setTimeout(() => {
                overlay.classList.add('hidden');
                modal.classList.add('hidden');
                modal.classList.remove('modal-exit-active');
                modal.classList.add('modal-enter');
                document.body.style.overflow = '';
            }, 300);
        }

        function applyBrandsFilter() {
            const badge = document.getElementById('brandsBadge');
            if(selectedBrands.size > 0) {
                badge.textContent = selectedBrands.size;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
            closeBrandsModal();
            applyFilters();
        }

        // Логика Модалки Info (Соцсети)
        function openInfoModal() {
            const modal = document.getElementById('info-modal');
            const overlay = document.getElementById('info-modal-overlay');
            overlay.classList.remove('hidden');
            modal.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                modal.classList.remove('modal-enter');
            }, 10);
            document.body.style.overflow = 'hidden';
        }

        function closeInfoModal() {
            const modal = document.getElementById('info-modal');
            const overlay = document.getElementById('info-modal-overlay');
            overlay.classList.add('opacity-0');
            modal.classList.add('modal-exit-active');
            setTimeout(() => {
                overlay.classList.add('hidden');
                modal.classList.add('hidden');
                modal.classList.remove('modal-exit-active');
                modal.classList.add('modal-enter');
                document.body.style.overflow = '';
            }, 300);
        }

        // Слушатели событий
        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                applyFilters();
            });

            document.getElementById('openWbBtn').addEventListener('click', () => {
                if(currentProduct) {
                    const wbUrl = `https://www.wildberries.ru/catalog/${currentProduct.nmId}/detail.aspx`;
                    tg.openLink(wbUrl);
                }
            });
        }
    </script>
</body>
</html>
